const card=(e,t,p,x="")=>`<div class="card ${x}"><div class="ic">${e}</div><h3>${t}</h3><p>${p}</p></div>`;
function render(l){
  const d=T[l];
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=d[el.dataset.t]||""});
  document.getElementById("fG").innerHTML=d.f.map(a=>card(...a)).join("");
  document.getElementById("sG").innerHTML=d.s.map((a,n)=>`<div class="card step"><div class="n">${n+1}</div><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join("");
  document.getElementById("pG").innerHTML=d.p.map(a=>card(...a)).join("");
  document.getElementById("iG").innerHTML=d.i.map(a=>card(...a)).join("");
  document.getElementById("dG").innerHTML=DOWNLOADS.map(x=>`<div class="card"><div class="ic">🌸</div><h3>${x.name}</h3><p>Minecraft ${x.mc} · v${x.ver}</p><a class="btn main" href="${x.url}" download>⬇ ${d.dB}</a></div>`).join("");
  document.getElementById("inst").innerHTML=d.inst.map(s=>`<li>${s}</li>`).join("");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  document.title="Couples Mod – "+d.tag.replace("🌸 ","");
  try{localStorage.setItem("cm-lang",l)}catch(e){}
}
document.getElementById("gh").href=GITHUB_REPO;
document.getElementById("lang").addEventListener("click",e=>{const l=e.target.dataset.l;if(l)render(l)});
let start="en";
try{start=localStorage.getItem("cm-lang")||""}catch(e){}
if(!T[start]){const n=(navigator.language||"en").slice(0,2);start=T[n]?n:"en"}
render(start);

/* image slider: img/1.png ... img/12.png */
(function(){
  const N=12,sl=document.getElementById("slider"),tr=document.getElementById("track"),dots=document.getElementById("dots"),cnt=document.getElementById("cnt");
  let i=0,timer,x0=null;
  function go(n){i=(n+N)%N;tr.style.transform=`translateX(-${i*100}%)`;[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));cnt.textContent=(i+1)+" / "+N}
  function auto(){clearInterval(timer);if(!matchMedia("(prefers-reduced-motion:reduce)").matches)timer=setInterval(()=>go(i+1),5000)}
  for(let n=1;n<=N;n++){
    tr.insertAdjacentHTML("beforeend",`<div class="slide" data-p="img/${n}.png"><img src="img/${n}.png" alt="Couples Mod screenshot ${n}" loading="${n<3?"eager":"lazy"}"></div>`);
    const b=document.createElement("button");b.setAttribute("aria-label","Image "+n);b.onclick=()=>{go(n-1);auto()};dots.appendChild(b);
  }
  tr.querySelectorAll("img").forEach(im=>im.addEventListener("error",()=>im.parentNode.classList.add("missing")));
  document.getElementById("prev").onclick=()=>{go(i-1);auto()};
  document.getElementById("next").onclick=()=>{go(i+1);auto()};
  sl.addEventListener("mouseenter",()=>clearInterval(timer));sl.addEventListener("mouseleave",auto);
  sl.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){go(i-1);auto()}if(e.key==="ArrowRight"){go(i+1);auto()}});
  sl.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  sl.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){go(i+(dx<0?1:-1));auto()}x0=null});
  go(0);auto();
})();

/* “coming soon” popup for CurseForge links */
(function(){
  const m=document.getElementById("modal");
  document.querySelectorAll("[data-soon]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();m.classList.add("open")}));
  m.addEventListener("click",e=>{if(e.target===m||e.target.id==="mc")m.classList.remove("open")});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")m.classList.remove("open")});
})();
